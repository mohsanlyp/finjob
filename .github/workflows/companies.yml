name: Update company directory
on:
  schedule:
    - cron: '20 3 * * 1'   # every Monday 03:20 UTC
  push:
    paths: ['scripts/build_companies.py', '.github/workflows/companies.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: data-commit, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install openpyxl==3.1.5
      - run: python scripts/build_companies.py
      - name: Commit directory
        if: always()
        run: |
          git config user.name "finjob-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/companies reports/companies_build.json || true
          git commit -m "Update company directory" || echo "nothing to commit"
          git pull --rebase -q origin main && git push
